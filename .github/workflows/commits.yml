name: Commits

on:
  - pull_request

permissions:
  contents: read

jobs:
  dco-check:
    permissions:
      pull-requests: read  # for the DCO action to list the PR's commits
    name: Signed-off-by (DCO)
    runs-on: ubuntu-latest
    steps:
      - name: Check that all commits are signed-off
        uses: KineticCafe/actions-dco@a52e56727ec21d6cdba26513826e1ae4a752d2fc # v3.2.1

  llm-commit-policy:
    permissions:
      contents: none
    name: LLM commit policy
    runs-on: ubuntu-latest
    steps:
      # Only git metadata is inspected, never project code.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check LLM commit policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu

          # Inspired by https://github.com/yaml/go-yaml/pull/340
          agents="(aider|anthropic|claude|codex|copilot|devin|gemini|grok|openai)"

          commits=$(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          for commit in $commits; do
              if git log -n 1 "$commit" | tr '[:upper:]' '[:lower:]' | grep -qE "(author|assisted-by|co-authored-by|signed-off-by):.*$agents"; then
                  echo "Error: The following commit appears to violate this repo's LLM/AI contribution policy:"
                  echo ""
                  git log -n 1 "$commit"

                  exit 1
              fi
          done
