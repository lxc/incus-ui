name: REUSE Compliance Report

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: write
  statuses: write

jobs:
  report:
    name: Report REUSE compliance
    runs-on: ubuntu-latest
    steps:
      # Bootstrap status reporting must work without repository scripts.
      - name: Mark check as pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const language = { description: 'Checking REUSE compliance and differential attribution.' };
            const { owner, repo } = context.repo;
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: context.payload.pull_request.head.sha,
              state: 'pending', context: 'REUSE Compliance', description: language.description,
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
            });

      - name: Check out trusted workflow scripts
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Download report artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reuse-report
          path: ${{ runner.temp }}/reuse-artifact

      - name: Evaluate REUSE compliance and comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/reuse-artifact
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            await require("./trusted/.github/scripts/reuse/report.cjs")({ github, context, core });

      - name: Report workflow failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const language = { description: 'REUSE reporting could not complete. See the workflow logs.' };
            const { owner, repo } = context.repo;
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: context.payload.pull_request.head.sha,
              state: 'error', context: 'REUSE Compliance', description: language.description,
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
            });
